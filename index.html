<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPHA - Bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            /* Use dynamic viewport height for mobile browsers to avoid jumps */
            min-height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: white;
            overflow: hidden; /* Prevents scrollbars */
            position: relative;
        }

        /* --- Background Video Setup --- */
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            /* Ensures video covers screen without stretching */
            object-fit: cover; 
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: brightness(0.4); /* Darken video so text is readable */
        }

        /* --- Mute/Unmute Button --- */
        #mute-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        #mute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* --- Main Card Container --- */
        .container {
            text-align: center;
            z-index: 1;
            padding: 20px;
            width: 90%; /* Responsive width */
            max-width: 400px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Profile Image Area --- */
        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 70%;
            object-fit: cover;
            border: 3px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        /* --- Typography --- */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #6a85b6, #bac8e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(88, 106, 255, 0.5);
        }

        .designation {
            font-size: 1.0rem;
            color: #ccc;
            margin-bottom: 5px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #ccc;
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }


        /* --- Social Icons Grid --- */
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px; /* Smaller gap for mobile */
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-btn:hover {
            transform: translateY(-5px);
            background: white;
            color: black;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .profile-pic { width: 90px; height: 90px; }
            .social-btn { width: 45px; height: 45px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://cdn.discordapp.com/attachments/1462098048355143786/1466746862030684365/background.mp4?ex=697dddf6&is=697c8c76&hm=43a037a5c5d5f9a10f3f7635657d77e64336a99808d6f1a59d03c96ec9fa259c&" type="video/mp4">
        <div style="background-color: #111; width: 100%; height: 100%;"></div>
    </video>

    <div id="mute-btn" onclick="toggleMute()">
        <i class="fa-solid fa-volume-xmark" id="mute-icon"></i>
    </div>

    <div class="container">
        
        <div class="profile-wrapper">
            <img src="https://cdn.discordapp.com/attachments/1462098048355143786/1466548253943140455/1769722722880.png?ex=697dcdbe&is=697c7c3e&hm=a533e3f14141039e44fde83428f234011ce9bd61516871e31476a9d7bc78b8da&" alt="ALPHA" class="profile-pic">
        </div>

        <h1>ALPHA</h1>
        <p class="designation">CEO of SG Cheats</p>
        <p class="subtitle">Indian Panel seller & Developer</p>

        <div class="social-links">
            <a href="https://www.instagram.com/mr.a1pha07/" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://youtube.com/@alpha-2608" class="social-btn"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://discord.gg/BJWsNcVYKg" class="social-btn"><i class="fa-brands fa-discord"></i></a>
        </div>

    </div>

    <script>
        function toggleMute() {
            var video = document.getElementById('bg-video');
            var icon = document.getElementById('mute-icon');

            if (video.muted) {
                video.muted = false;
                // Some browsers require volume to be set explicitly after unmute
                video.volume = 1.0; 
                icon.classList.remove('fa-volume-xmark');
                icon.classList.add('fa-volume-high');
            } else {
                video.muted = true;
                icon.classList.remove('fa-volume-high');
                icon.classList.add('fa-volume-xmark');
            }
        }
    </script>
</body>
</html>
